<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - TCM Travel Channel Manager</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#333; line-height:1.6; background:#f5f8f6; display:flex; justify-content:center; align-items:center; min-height:100vh; }
.card { background:#fff; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,0.08); padding:48px 40px; max-width:420px; width:90%; text-align:center; }
.card h1 { font-size:1.5em; color:#1a8a5c; margin-bottom:8px; }
.card p { color:#666; margin-bottom:32px; font-size:0.95em; }
.btn-tiktok, .btn-youtube { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; padding:16px; border-radius:10px; text-decoration:none; font-size:1em; font-weight:600; margin-bottom:14px; transition:transform 0.15s,box-shadow 0.15s; }
.btn-tiktok { background:#000; color:#fff; }
.btn-tiktok:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(0,0,0,0.2); }
.btn-youtube { background:#ff0000; color:#fff; }
.btn-youtube:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(255,0,0,0.2); }
.btn-icon { font-size:1.5em; }
.note { font-size:0.8em; color:#999; margin-top:20px; }
.note a { color:#1a8a5c; }
.info { font-size:0.75em; color:#999; margin:-10px 0 18px 0; }

.divider { display:flex; align-items:center; gap:12px; margin:18px 0; color:#bbb; font-size:0.85em; }
.divider::before, .divider::after { content:""; flex:1; height:1px; background:#e0e0e0; }
.divider span { white-space:nowrap; }

.btn-guest { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:14px; border-radius:10px; text-decoration:none; font-size:0.95em; color:#666; background:#f5f5f5; border:1px solid #ddd; transition:background 0.15s,border-color 0.15s; margin-bottom:14px; }
.btn-guest:hover { background:#eee; border-color:#ccc; }
</style>
</head>
<body>
<div class="card">
  <h1>Sign In</h1>
  <p>Choose a platform to connect your account. You will be securely redirected to the platform's authorization page.</p>

  <a href="https://www.tiktok.com/v2/auth/authorize?client_key=awhu3qbg4jtky56i&scope=user.info.basic,video.publish&response_type=code&redirect_uri=https://linctaichina-afk.github.io/tcm-travel-privacy/" class="btn-tiktok">
    <span class="btn-icon">♪</span> Continue with TikTok
  </a>
  <div class="info">TikTok 正在审核中，审核通过后即可使用</div>

  <a href="https://accounts.google.com/o/oauth2/v2/auth?client_id=225938592399-d7v1g0hjm8buvpkj4leduroe66nuncag.apps.googleusercontent.com&redirect_uri=https://linctaichina-afk.github.io/tcm-travel-privacy/&response_type=code&scope=https://www.googleapis.com/auth/youtube.upload" class="btn-youtube">
    <span class="btn-icon">▶</span> Continue with YouTube
  </a>

  <div class="divider"><span>or</span></div>

  <a href="./" class="btn-guest">
    <span class="btn-icon">👤</span> Continue as Guest
  </a>

  <div class="note">
    By signing in, you agree to our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.
  </div>
</div>
</body>
</html>
